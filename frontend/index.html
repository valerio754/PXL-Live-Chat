<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PXL-Live Chat Colaborativo</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-panel: #1e293b;
            --my-msg-color: #2563eb;
            --other-msg-color: #334155;
            --text-main: #f8fafc;
            --accent: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-panel);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-image: radial-gradient(#1e293b 0.5px, transparent 0.5px);
            background-size: 20px 20px;
        }

        /* Estilo Burbujas */
        .msg {
            padding: 10px 14px;
            border-radius: 18px;
            max-width: 70%;
            font-size: 0.95rem;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Mis mensajes (Derecha) */
        .my-msg {
            background-color: var(--my-msg-color);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* Mensajes de otros (Izquierda) */
        .other-msg {
            background-color: var(--other-msg-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        /* Mensajes de sistema (Centro) */
        .sys-msg {
            background-color: rgba(51, 65, 85, 0.6);
            align-self: center;
            font-size: 0.8rem;
            color: #94a3b8;
            border-radius: 10px;
            max-width: 85%;
            box-shadow: none;
        }

        .username {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 3px;
            color: #93c5fd;
        }

        .time {
            font-size: 0.65rem;
            opacity: 0.7;
            margin-top: 4px;
            align-self: flex-end;
        }

        /* Área de entrada */
        .input-area {
            background-color: var(--bg-panel);
            padding: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1d4ed8;
            transform: scale(1.05);
        }

        /* Pantalla de Login */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-body);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-box {
            background: var(--bg-panel);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid var(--accent);
            width: 300px;
        }

        .login-box h2 { margin-top: 0; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>🚀 PXL-Live</h2>
            <p>Ingresa tu nombre para comenzar</p>
            <input type="text" id="nameInput" placeholder="Nombre o alias..." style="width: 80%; margin-bottom: 20px;">
            <br>
            <button onclick="startChat()">Entrar al Chat</button>
        </div>
    </div>

    <header>
        <strong>🚀 PXL-Live Chat | Grupo PIXEL</strong>
    </header>

    <div id="chat-container"></div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Escribe un mensaje colaborativo..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">Enviar</button>
    </div>

    <script>
        let socket;
        let myName;

        function startChat() {
            const inputVal = document.getElementById('nameInput').value.trim();
            myName = inputVal || "Usuario_" + Math.floor(Math.random() * 999);
            
            document.getElementById('login-overlay').style.display = 'none';
            
            // Conectar al WebSocket
            socket = new WebSocket(`ws://localhost:8000/ws/${myName}`);
            
            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const chatContainer = document.getElementById('chat-container');
                const div = document.createElement('div');
                
                if (data.type === 'sys') {
                    div.className = 'msg sys-msg';
                    div.innerHTML = `<span>${data.msg}</span> <span class="time">${data.time}</span>`;
                } else if (data.user === myName) {
                    div.className = 'msg my-msg';
                    div.innerHTML = `<span>${data.msg}</span> <span class="time">${data.time}</span>`;
                } else {
                    div.className = 'msg other-msg';
                    div.innerHTML = `<span class="username">${data.user}</span><span>${data.msg}</span> <span class="time">${data.time}</span>`;
                }
                
                chatContainer.appendChild(div);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            };

            socket.onclose = () => {
                alert("Conexión perdida con el servidor.");
            };
        }

        function send() {
            const input = document.getElementById('msgInput');
            if (input.value.trim() && socket) {
                socket.send(input.value);
                input.value = '';
            }
        }
    </script>
</body>
</html>
